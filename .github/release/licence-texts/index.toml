# The standard texts of the licences this project accepts, kept byte for byte as
# the SPDX License List publishes them, and the digest of each.
#
# What they are for. A crate is supposed to carry its licence text, and 29 of the
# 324 crates the release archives were built from on 2026-10-09 carry none at all.
# Their notice still has to be given, so .github/scripts/contents.py gives the
# standard text of the licence the crate declares, from here, and says beside it
# that the crate shipped no file of its own. A crate that does carry its text is
# always given its own text, because that is the one with its copyright line.
#
# Where they come from: https://github.com/spdx/license-list-data, the `text`
# directory at tag v3.29.0 (released 2026-09-16), downloaded on 2026-10-09. The
# digests below are of those downloads. A digest that stops matching means the
# file was edited, or rewritten with other line endings, and the notices would
# then quote a text nobody published.
#
# The list holds the licences deny.toml allows, minus GPL-3.0-only, whose text is
# LICENSE at the root of the repository. A licence allowed there and missing here
# is refused when a crate needs it, not guessed.

list = "SPDX License List 3.29.0"
source = "https://github.com/spdx/license-list-data/tree/v3.29.0/text"

