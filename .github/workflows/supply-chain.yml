name: Supply chain

# Asks cargo-deny four questions about the dependency tree. The rules and the
# reason for each are in deny.toml.
#
# Two jobs and not one, on purpose. Licences, bans and sources depend only on
# what is in this repository, so a red result there is always about a change
# made here. Advisories depend on a database that changes by itself, so a red
# result there can appear with no change at all. Kept apart, a new advisory
# never hides the licence verdict, and nobody learns to ignore a red check.
#
# There is no paths filter, on purpose. A check that a branch rule requires and
# that never started blocks the merge for good, and a filter is exactly how that
# happens. Both jobs can be required.
#
# Requiring advisories is the strict choice and it has a price. A new advisory
# against any crate in the tree, one inside Slint included, then blocks every merge
# until the crate is updated or the advisory is written into deny.toml with the
# reason it does not apply to this project. The second is one small pull request,
# and the check passes on it, because it runs against the deny.toml of the pull
# request. The Monday run below is what tells you before a pull request does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New advisories arrive with no change here, so the tree is asked again every
  # Monday. A failed scheduled run is reported to whoever last edited the
  # schedule below.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rules:
    name: licences, bans and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check licences, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

      # The same question asked the way a release asks it: can every archive be
      # described, with a bill of materials and the licence text of everything
      # compiled into it. A crate that brings no licence text a notice can quote,
      # or a file compiled in that the register does not name, fails here on its
      # pull request and not on the day of a release. Nothing is written.
      #
      # The Cargo of the runner image is enough: this reads the lock file and the
      # crates, and compiles nothing. Every crate of every target is fetched,
      # because the notices quote the licence files inside them.
      - name: Describe what every release archive contains
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cargo --version
          python3 --version
          cargo fetch --locked
          python3 .github/scripts/contents.py check

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
