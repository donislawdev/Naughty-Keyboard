# The shape of the code beyond what clippy.toml holds, as a RATCHET: every
# number here may only come down, and each must BE today's measurement.
#
# Read by .github/scripts/shape_gate.py (the clippy tables) and by
# crates/nkb-cli/tests/shape.rs (the file tables). Why each number exists and
# what checks it is written there.

[clippy]
# Near a ceiling, for length and complexity: at or above this fraction of it.
# Nesting and arguments count only what stands at the ceiling itself.
band = 0.7

# The code the two programs are made of: libraries and binaries, without tests
# and examples. Measured 2026-10-08 on Windows with clippy 0.1.99. Complexity
# 23 since 2026-10-11, when the reading of the remembered places left the
# settings file's settings_of, its holder. Length 158 since 2026-10-15, when the
# sentences about pairs left the lint report's sentence.
[clippy.product]
too-many-lines-threshold = 158
cognitive-complexity-threshold = 23
excessive-nesting-threshold = 6
too-many-arguments-threshold = 7

# How many stand near each ceiling, per scope. Two at seven arguments since
# 2026-10-15, when a send started taking the chosen value as one argument.
# Eight near the length since the same day: the ceiling came down to 158 and
# the band with it, onto settings_of, which did not grow. Nine since 2026-10-24,
# when the sentence for a field this build cannot clear took pattern_message
# from 108 lines to 111, the edge of the band. The count is the owner's to
# accept, as it was for toml_pack.rs. Eight since 2026-10-27, when the
# sentences of a value that did not go into the field left classify for a
# function of their own.
[clippy.near.product]
too-many-lines-threshold = 8
cognitive-complexity-threshold = 1
excessive-nesting-threshold = 1
too-many-arguments-threshold = 2

[clippy.near.all]
too-many-lines-threshold = 3
cognitive-complexity-threshold = 2
excessive-nesting-threshold = 1
too-many-arguments-threshold = 2

# The size of a file, in lines that hold code: a comment or a blank line is
# free, a line inside a string is code. Clippy has no lint for it, so
# crates/nkb-adapters/tests/shape.rs measures it. Measured 2026-10-08.
[files]
band = 0.7

# A Rust file under src, up to its test module: what the programs are made of.
# nkb-cli/src/main.rs. Until 2026-10-10 nkb-adapters/src/i18n.rs at 1440 and
# nkb-gui/src/live.rs at 1196, which then moved the windows' words and the
# palette's view into modules of their own rather than raise this. 1121 since
# 2026-10-13, when what nkb send says about the clearing went to clearing.rs.
# 1119 since 2026-10-14, when what nkb new-pack says about the format fit on
# one line. 1015 since 2026-10-19, when what nkb send says about a refusal went
# to refusals.rs to make room for the macOS permission. 1009 since 2026-10-20,
# when the notes under a send went to sent_notes.rs with the one about the
# system's text substitutions. 983 since 2026-10-23, when the line before a
# send, where the value is about to go, went to target_line.rs with the sentence
# for a session that cannot name the window. 969 since 2026-10-25, when what
# nkb send says on its way went to on_the_way.rs with the line for a clearing
# that waits for the person to allow the keys. 937 since 2026-10-27, when what
# nkb lint and nkb fmt say about the file they were named went to pack_file.rs
# with the refusal of a name that does not end in .toml. 932 since the same
# day, when what nkb send says of a value cut short went to refusals.rs with
# the sentence for keys still on their way.
# near = 4 since 2026-10-19: the ceiling came down by 104, and the band with it,
# so three files that did not grow joined it (advance_sequence.rs, toml_pack.rs
# and picker.rs). The count is the owner's to accept, as it was for toml_pack.rs.
# 5 since 2026-10-25, the owner's choice: the ceiling came down to 969 and
# nkb-adapters/src/i18n.rs, which did not grow, joined at 688. 6 since
# 2026-10-27, the owner's choice: the ceiling came down to 937 and
# nkb-gui/src/live.rs, which did not grow, joined at 663. 5 since 2026-10-27,
# when what a delivery outcome means went from advance_sequence.rs to
# advance_sequence/classify.rs.
[files.rust-product]
ceiling = 932
near = 5

# A whole Rust file, its tests included. nkb-gui/src/live.rs, then
# nkb-adapters/src/i18n.rs at 2101. 2199 since 2026-10-27, when what a delivery
# outcome means left nkb-app/src/advance_sequence.rs for a module of its own to
# make room for the sentence of a display another send is typing on, and
# live.rs is the largest again.
[files.rust-whole]
ceiling = 2199
# 5 since 2026-10-10, the owner's choice twice that day: the ceiling came down
# from 2907 to 2481, 2408, 2407 and 2363 as live.rs moved code into modules, the
# band came down with it, and it reached advance_sequence.rs, settings_file.rs
# and nkb-cli's main.rs, none of which had grown. 2351 on 2026-10-11, when the
# compact switch went to live/folds.rs with the fold of the shortcut list. 6
# since 2026-10-14, the owner's choice: the shortcuts the palette holds went to
# live/hold.rs with their tests, the ceiling came down to 2268, and the band
# reached toml_pack.rs at 1643. 2235 on 2026-10-14, when the words naming the
# shortcuts went to live/view.rs beside the band that shows them. 2233 on
# 2026-10-15, when a test of live.rs named its value by the helper the module
# already had. Below 2195 it would reach keep_settings.rs at 1536. 5 since
# 2026-10-23, when nkb-cli's main.rs gave the line before a send and its tests
# to target_line.rs and fell out of the band at 1679. 2204 since 2026-10-25,
# when the test of the palette's labels moved from nkb-adapters/src/i18n.rs,
# which a new label had taken to the ceiling, to the file that defines the
# labels, and the tests of the sentence for a clearing that waits for the
# person went to live/view.rs beside it, and live.rs is the largest again. 6 since
# the same day, the owner's choice: nkb-app/src/keep_settings.rs, which did not
# grow, joined the band at 1561.
near = 6

# A Slint file, the gallery excepted. ui/screens/palette.slint since the fold
# of its shortcut list (2026-10-11), then ui/components/list.slint at 260 once
# the fold's heading went to a file of its own. The About window's facts went
# to a file of their own rather than take ui/components/chrome.slint into the
# band. 306 since the header's links became one list (2026-10-14), and 283
# since the palette's status line went to a file of its own to make room for
# the header's own frame (2026-10-23).
[files.slint]
ceiling = 283
near = 2
