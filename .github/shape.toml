# The shape of the code beyond what clippy.toml holds, as a RATCHET: every
# number here may only come down, and each must BE today's measurement.
#
# Read by .github/scripts/shape_gate.py (the clippy tables) and by
# crates/nkb-cli/tests/shape.rs (the file tables). Why each number exists and
# what checks it is written there.

[clippy]
# Near a ceiling, for length and complexity: at or above this fraction of it.
# Nesting and arguments count only what stands at the ceiling itself.
band = 0.7

# The code the two programs are made of: libraries and binaries, without tests
# and examples. Measured 2026-10-08 on Windows with clippy 0.1.99. Complexity
# 23 since 2026-10-11, when the reading of the remembered places left the
# settings file's settings_of, its holder.
[clippy.product]
too-many-lines-threshold = 163
cognitive-complexity-threshold = 23
excessive-nesting-threshold = 6
too-many-arguments-threshold = 7

# How many stand near each ceiling, per scope.
[clippy.near.product]
too-many-lines-threshold = 7
cognitive-complexity-threshold = 1
excessive-nesting-threshold = 1
too-many-arguments-threshold = 3

[clippy.near.all]
too-many-lines-threshold = 3
cognitive-complexity-threshold = 2
excessive-nesting-threshold = 1
too-many-arguments-threshold = 3

# The size of a file, in lines that hold code: a comment or a blank line is
# free, a line inside a string is code. Clippy has no lint for it, so
# crates/nkb-adapters/tests/shape.rs measures it. Measured 2026-10-08.
[files]
band = 0.7

# A Rust file under src, up to its test module: what the programs are made of.
# nkb-cli/src/main.rs. Until 2026-10-10 nkb-adapters/src/i18n.rs at 1440 and
# nkb-gui/src/live.rs at 1196, which then moved the windows' words and the
# palette's view into modules of their own rather than raise this. 1121 since
# 2026-10-13, when what nkb send says about the clearing went to clearing.rs.
[files.rust-product]
ceiling = 1121
near = 1

# A whole Rust file, its tests included. nkb-gui/src/live.rs, then
# nkb-adapters/src/i18n.rs at 2084.
[files.rust-whole]
ceiling = 2351
# 5 since 2026-10-10, the owner's choice twice that day: the ceiling came down
# from 2907 to 2481, 2408, 2407 and 2363 as live.rs moved code into modules, the
# band came down with it, and it reached advance_sequence.rs, settings_file.rs
# and nkb-cli's main.rs, none of which had grown. 2351 on 2026-10-11, when the
# compact switch went to live/folds.rs with the fold of the shortcut list. Below
# 2348 the band would reach toml_pack.rs at 1643.
near = 5

# A Slint file, the gallery excepted. ui/screens/palette.slint since the fold
# of its shortcut list (2026-10-11), then ui/components/list.slint at 260 once
# the fold's heading went to a file of its own. The About window's facts went
# to a file of their own rather than take ui/components/chrome.slint into the
# band.
[files.slint]
ceiling = 310
near = 2
