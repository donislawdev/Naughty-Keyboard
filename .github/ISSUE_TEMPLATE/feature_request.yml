name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A new awkward value for the packs is not a feature request. Please use
        **Suggest a value** for that, which asks for what a value needs.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The testing situation that is awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: What you would like the tool to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: >-
        Two things this project has decided and will not revisit without a new
        argument. Saying so here saves you writing a proposal that was never
        going to be accepted.
      options:
        - label: This does not need the tool to read what a window shows. It reads the kind of control that has the focus and the name of the program, never a title, a text or a value, and tests hold it to that. Reading more would change what the tool is.
          required: true
        - label: This is not about attacking anything. Naughty Keyboard is for testing software you are responsible for, and the packs hold values that real users and real data produce, with no exploit payloads in them.
          required: true
  - type: checkboxes
    id: surfaces
    attributes:
      label: Both programs
      options:
        - label: I understand that a capability lives in the engine and appears in both the palette and the command line, rather than in one of them. Neither program is a reduced version of the other.
