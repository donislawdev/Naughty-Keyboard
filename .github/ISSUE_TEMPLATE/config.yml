# Problems belong here, on the issue tracker, where anyone hitting the same thing
# can find the answer. There is deliberately no link out to a support page: the
# only other channel is for vulnerabilities, which must not be public until there
# is a fix.
#
# Blank issues are off because every template below asks for the few things that
# make a report answerable - the version, which program, and which system. A
# question that fits none of them still has a home: "Question or problem".
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/donislawdev/Naughty-Keyboard/security/advisories/new
    about: Please report security issues privately, never as a public issue.
  - name: Read the honest limits first
    url: https://github.com/donislawdev/Naughty-Keyboard#honest-limits
    about: What works on which system, and what is not there yet, is written down in the README.
