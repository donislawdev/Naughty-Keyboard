# expect: E050
#
# The safety property of the whole translation mechanism. A reviewer reading a
# translation is reading prose, and nothing in that file may change what a tester
# inserts into somebody else's application.
#
# This file breaks it twice on purpose, with two different fields: `value` names
# the text directly, `count` decides how much of it there is. The rule covers
# every field that answers "what gets sent", not only the first of them - a
# safety property with three doors left open is not a safety property.
#
# It translates a pack that is in this directory, and names entries that pack
# really has, so that E050 arrives on its own. Until 2026-09-07 it pointed at a
# pack nobody could resolve, which cost nothing while E051 was unwritten and
# would have made this file report two rules the day it was.

format     = 1
translates = "translated-pack"
language   = "pl"

[pack]
name        = "Paczka tlumaczona"
description = "Dlugosci ciagow, ktore psuja uklad, zanim ktokolwiek to zauwazy."

[values.short-run]
name   = "Krotki ciag"
breaks = "Bliski koniec zakresu, znaczacy wylacznie obok dalekiego konca."
value  = "abc"

[values.long-run]
name  = "Dlugi ciag"
count = 5
