# expect: E026
#
# The count on its own is inside the range E024 allows. Only the product rule
# sees this: a unit of two thousand characters repeated a million times is two
# billion characters, described by a file of a few kilobytes.

format = 1

[pack]
id          = "repeat-product-too-large"
name        = "Two billion characters from four kilobytes"
description = "Describes more code points than the format allows, without saying so."
version     = "1.0"
updated     = 2026-09-06
license     = "CC-BY-4.0"
authors     = ["Naughty Keyboard"]
language    = "en"
tags        = ["format-suite"]

[[values]]
id     = "two-billion-characters"
name   = "Test value"
type   = "repeat"
unit   = ""
count  = 1000000
breaks = "Nothing on its own - this value exists so the file is otherwise complete."
expect = "Nothing - this file exists to be judged by the validator, not to be inserted anywhere."
since  = "1.0"
