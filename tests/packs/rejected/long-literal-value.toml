# expect: W026
#
# A warning and not an error: the value is correct, the file is merely harder to
# review than it needs to be. This file must still be accepted, which is exactly
# what separates a warning from a blocking rule.

format = 1

[pack]
id          = "long-literal-value"
name        = "Very long written out value"
description = "Writes out a value long enough that a recipe would read better."
version     = "1.0"
updated     = 2026-09-06
license     = "CC-BY-4.0"
authors     = ["Naughty Keyboard"]
language    = "en"

[[values]]
id     = "wall-of-text"
name   = "Test value"
value  = ""
breaks = "Nothing on its own - this value exists so the file is otherwise complete."
expect = "Nothing - this file exists to be judged by the validator, not to be inserted anywhere."
since  = "1.0"
