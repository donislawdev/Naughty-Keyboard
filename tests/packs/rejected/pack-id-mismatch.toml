# expect: E010
#
# A pack is addressed by its file name and cited by the identifier inside it.
# When the two disagree, a report written two years ago cites a pack that the
# tool cannot find, and nothing says why.

format = 1

[pack]
id          = "somewhere-else"
name        = "Pack id mismatch"
description = "Declares an identifier that is not this file's name."
version     = "1.0"
updated     = 2026-09-06
license     = "CC-BY-4.0"
authors     = ["Naughty Keyboard"]
language    = "en"

[[values]]
id     = "anything"
name   = "Anything"
value  = "anything"
breaks = "Nothing on its own - this value only exists so the file is otherwise complete."
expect = "Nothing - this file exists to be judged by the validator, not to be inserted anywhere."
since  = "1.0"
