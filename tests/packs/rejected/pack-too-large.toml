# expect: W062
#
# Sixty one values, where the format suggests at most sixty. A tester meets
# them in the order they are written, so a pack this long has a tail nobody
# reaches - the values at the bottom are shipped and never seen.
#
# The values below are deliberately dull and deliberately numerous. The
# count is the whole test.

format = 1

[pack]
id          = "pack-too-large"
name        = "Pack too large"
description = "Holds more values than a tester will ever reach by pressing the shortcut."
version     = "1.0"
updated     = 2026-09-07
license     = "CC-BY-4.0"
authors     = ["Naughty Keyboard"]
language    = "en"
tags        = ["format-suite"]

[[values]]
id     = "filler-01"
name   = "Filler 01"
value  = "filler-01"
breaks = "Nothing on its own - this value is here so that the pack has more values than the format suggests."
expect = "Nothing - this file exists to be judged by the validator, not to be inserted anywhere."
since  = "1.0"

