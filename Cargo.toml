# Naughty Keyboard - workspace root.
#
# The layer split below is not a convention, it is enforced by the compiler.
# Each layer is its own package, so reaching upwards is a compile error rather
# than a style violation. See docs for the architecture that describes why.
#
# Dependency direction, and nothing else:
#
#   nkb-cli ---.
#              +--> nkb-adapters --> nkb-app --> nkb-core
#   nkb-gui ---'         |
#                        '--> nkb-sys        (the operating system)
#
# nkb-core depends on nothing. That is the whole rule in one line.
#
# nkb-sys is the sidecar added on 2026-09-08 for the first real system call.
# It sits BESIDE core rather than above it: it depends on nothing of ours, and
# nothing of ours depends on it except the adapter layer, which is the only
# layer allowed to know what a system is. It is also the only package where
# `unsafe` compiles - see its own manifest for why that is a package and not
# an exception.

[workspace]
resolver = "3"
members = [
    "crates/nkb-core",
    "crates/nkb-app",
    "crates/nkb-adapters",
    "crates/nkb-sys",
    "crates/nkb-cli",
    "crates/nkb-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/donislawdev/Naughty-Keyboard"
rust-version = "1.98"

[workspace.dependencies]
nkb-core = { path = "crates/nkb-core" }
nkb-app = { path = "crates/nkb-app" }
nkb-adapters = { path = "crates/nkb-adapters" }
nkb-sys = { path = "crates/nkb-sys" }

# Pinned deliberately. Versions were checked against the registry on 2026-09-06,
# not recalled from memory - see the untouchable rule about dependency versions.
toml_edit = "0.25.13"

# The operating system, on Windows. Version checked against the registry on
# 2026-09-08 - not recalled. Used by nkb-sys alone, and only under
# `cfg(windows)`. The features are named there rather than here so that the
# package asking for them is the package that documents why.
#
# Licence sieve is in nkb-sys/Cargo.toml beside the dependency itself, because
# that is where someone reading the FFI will look for it.
windows-sys = "0.61.2"

# The graphical toolkit. Chosen in ADR-4 on 2026-09-07 after probes, not after
# reading. Version checked against the registry on the same day.
#
# Licence sieve, both questions:
#   (a) Slint is offered under GPL-3.0-only OR two proprietary options. We take
#       GPL-3.0-only, which is exactly this workspace's `license` field, so the
#       combination needs no argument. The price is one-way: nkb-gui can never be
#       relicensed without buying a Slint licence.
#   (b) not applicable - a library, not a reference dataset.
#
# Only nkb-gui depends on this. `nkb` links no graphical toolkit at all, and that
# is a property of the artefact rather than of anyone's discipline - D25.
slint = "1.18.1"
slint-build = "1.18.1"

# The window-handle vocabulary. Not a second toolkit: it is the set of types
# through which every Rust windowing library reports "here is the native window",
# and Slint hands its handle out through it behind the `raw-window-handle-06`
# feature. Added 2026-09-22 for C5b, where the palette has to put
# `WS_EX_NOACTIVATE` on its own window. Version checked against the registry the
# same day.
#
# Licence sieve, both questions:
#   (a) MIT OR Apache-2.0 OR Zlib. All three are compatible with GPL-3.0 and the
#       choice is ours, so nothing here narrows the workspace licence.
#   (b) not applicable - a set of types, not a reference dataset.
#
# 🔴 Only nkb-gui depends on this, and the reason is the layer rather than the
# size: the package that OWNS a window is the only one entitled to ask what its
# handle is. The call that uses the handle lives in nkb-sys, reached through
# nkb-adapters, so `nkb` gains nothing from this line - D25 again.
raw-window-handle = "0.6.2"

# The system clipboard, for the report block (D68) - and later for clipboard
# mode. NOT a new library in the product: Slint's winit backend already links
# this very crate for its own text fields, so the palette carried it before this
# line existed. Checked against the registry 2026-09-23: 3.6.1 is both the
# newest release and the one Slint 1.18.1 locks. A caret, not `=`: when Slint
# moves, Cargo unifies the two on one copy instead of shipping both, and
# nkb-gui/tests/clipboard_moves_with_slint.rs goes red if the lock ever holds two.
#
# `default-features = false` because the default is `image-data`, which pulls an
# image decoder into the product for a feature nobody here uses. Slint declares
# it the same way.
#
# Licence sieve, both questions:
#   (a) MIT OR Apache-2.0 - compatible with GPL-3.0, and the choice is ours.
#   (b) not applicable - a library, not a reference dataset.
#
# 🔴 Only nkb-gui depends on this, and that is D25 once more: in nkb-adapters,
# which `nkb` links, Cargo's feature unification would carry AppKit and the X11
# client into the CLI on any workspace-wide build.
arboard = { version = "3.6.1", default-features = false }

# The program's icon, put into `nkb-gui.exe` on Windows. The icon lives in the
# executable and nowhere beside it - the file manager, a desktop shortcut and the
# taskbar all read it from there - so something has to compile a resource script
# into the binary. Nothing happens on any other target.
#
# Version checked against the registry on 2026-10-07 - not recalled. 3.0.11 and
# not 3.0.12, which was the newest that day: it had been out for one day, and
# nothing here needs a release that has had no time to be noticed if it is wrong.
# An exact version rather than a caret, so that the next `cargo update` does not
# quietly move to the release this one was chosen not to be.
#
# Chosen over `winresource`, the other crate that does this, because that one
# always writes a version block of its own as well, filled in from the package
# manifest - and the manifest's description would then be the name the task
# manager shows for the program. This one compiles exactly the resource script
# it is given, which is an icon and nothing else.
#
# Licence sieve, both questions:
#   (a) MIT - compatible with GPL-3.0, and nothing of it is linked into the
#       product: it runs in the build script and leaves only the resource.
#   (b) not applicable - a build tool, not a reference dataset.
#
# 🔴 Only nkb-gui's build script depends on this, and the reason is the layer:
# `nkb` has no window, so nothing in it asks for an icon - D25.
embed-resource = "=3.0.11"

# Test-only: reads the import table of the two built programs, for the guard
# that the tool opens no network connection. That guard reads our source, and
# this is what lets it also see what the LINKER put into `nkb` and `nkb-gui`,
# including whatever a dependency brought along. Never linked into a released
# artefact - document 09 section 10, the lighter tier.
#
# Version checked against the registry on 2026-10-09 - not recalled. 0.40.0 was
# the newest release that day and had been out for two months.
#
# `default-features = false` because the default adds `compression`, which pulls
# two decompressors for the debug sections of a file, and nothing here reads
# those. The four features left are the reader itself and the three formats the
# three systems build: PE on Windows, ELF on Linux, Mach-O on macOS.
#
# Licence sieve, both questions:
#   (a) Apache-2.0 OR MIT, both of which combine with GPL-3.0, and the choice
#       is ours.
#   (b) not applicable - a library, not a reference dataset.
#
# Only the tests of nkb-cli and nkb-gui use it, each on its own binary, because
# a package's integration tests are the only place Cargo hands over the path of
# the binary it has just built.
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "macho", "pe"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Denied because a panic in a validator is a crash in someone else's CI.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# The shape of the code, held to ceilings that may only come down. The numbers
# are in clippy.toml and .github/shape.toml, and the reason is in
# .github/scripts/shape_gate.py. A warning and not a denial, because
# `-D warnings` in CI and in the local gates is what makes them a gate, and a
# local `cargo clippy` must still run to the end in the middle of an edit.
#
# nkb-gui and nkb-sys repeat this table rather than inherit it, and
# crates/nkb-cli/tests/shape.rs checks that both copies still carry these four.
too_many_lines = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_arguments = "warn"
