# The words of the website's own interface, in Polish.
#
# The same keys as en.toml, and nothing else. A key the English file has and
# this one lacks stops the build (--printI18nWarnings with --panicOnWarning).
#
# Polish counts in four plural forms (CLDR): one for 1, few for 2 to 4 and 22
# to 24 and so on, many for 0, 5 to 21, 25 and so on, other for a fraction. A
# word that takes a count has all four, and the number reaches it as an
# integer, never as the float JSON gives, which would always pick other.

