# The words of the website's own interface, in English.
#
# Every other language has a file with the same keys. A key a template asks
# for and a language does not have stops the build (--printI18nWarnings with
# --panicOnWarning), so no page goes out with a hole where a word should be.
#
# What the program itself says - the catalogue, the help, the names of the
# shortcuts - is not here. It comes from web/data/facts/, and its translations
# from web/data/translations/<language>/.

