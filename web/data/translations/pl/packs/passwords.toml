# Polish translations of the pack passwords, made from the program's English.
#
# source is the first twelve characters of the SHA-256 of the English each
# text was made from. When the program says something else, the site build
# stops and names the new digest, to be written here once the text below has
# been checked against the new English.

[pack.name]
source = "be146b37a009"
text = "Hasła"

[pack.description]
source = "4d95cf7d07b3"
text = "Hasła, które rejestracja i logowanie czytają inaczej: ucięte po 72 bajtach, przycięte, policzone źle."

[bcrypt-cut-register.name]
source = "f1a8844283e4"
text = "Krok 1: rejestracja z 72 literami a i cyfrą 1"

[bcrypt-cut-register.breaks]
source = "e270a0ae6d82"
text = "Krok 1 testu 72 bajtów: załóż nowe konto z tym hasłem o długości 73 bajtów. Nowsze biblioteki, takie jak Go x/crypto, Spring Security i bcrypt 5 dla Pythona, odmawiają go, a aplikacja, która tego nie obsłuży, pokazuje stronę błędu już tutaj."

[bcrypt-cut-register.expect]
source = "9b4bf2c29572"
text = "Konto założone albo odmowa z komunikatem, który podaje limit długości."

[bcrypt-cut-login.name]
source = "723c76dc7da5"
text = "Krok 2: logowanie z 72 literami a i cyfrą 2"

[bcrypt-cut-login.breaks]
source = "1a4d2245452f"
text = "Krok 2: zaloguj się do konta z kroku 1 tym hasłem, które różni się tylko 73. bajtem. Hash bcrypt, który czyta tylko pierwsze 72 bajty, jak w PHP, BCrypt.Net, jBCrypt, bcryptjs i pgcrypto, nie odróżni tych dwóch haseł."

[bcrypt-cut-login.expect]
source = "7a0b3cddd7e5"
text = "Logowanie odrzucone, bo to nie jest hasło, z którym konto założono."

[bytes-not-chars-register.name]
source = "1f7a112deb20"
text = "Krok 1: rejestracja z 36 polskimi literami i cyfrą 1"

[bytes-not-chars-register.breaks]
source = "72e00701199b"
text = "Krok 1 tego samego testu po polsku: 37 znaków, czyli mniej niż każdy limit liczony w znakach, i 73 bajty w UTF-8, bo każde ł zajmuje dwa bajty."

[bytes-not-chars-register.expect]
source = "d44b22c41423"
text = "Konto założone."

[bytes-not-chars-login.name]
source = "fbe00c8d3808"
text = "Krok 2: logowanie z 36 polskimi literami i cyfrą 2"

[bytes-not-chars-login.breaks]
source = "b170fd62b0c6"
text = "Krok 2: zaloguj się tym hasłem, które różni się tylko ostatnim znakiem. Limit 64 albo 72 znaków nie powstrzyma hasha, który czyta 72 bajty, przed ucięciem hasła."

[bytes-not-chars-login.expect]
source = "6d062749b651"
text = "Logowanie odrzucone."

[trailing-space-register.name]
source = "7f7f10c45036"
text = "Krok 1: rejestracja z hasłem zakończonym spacją"

[trailing-space-register.breaks]
source = "2a8756e58894"
text = "Krok 1 testu przycinania: załóż konto z hasłem, które kończy się spacją. Warstwa, która przycina dane, zapisze hasło bez niej."

[trailing-space-register.expect]
source = "67ad8366959d"
text = "Konto założone, a spacja została częścią hasła."

[trailing-space-login.name]
source = "57184b52575c"
text = "Krok 2: logowanie tym samym hasłem bez spacji"

[trailing-space-login.breaks]
source = "27f3476c1ab7"
text = "Krok 2: zaloguj się hasłem z kroku 1 bez końcowej spacji, potem jeszcze raz ze spacją. Rejestracja i logowanie, które przycinają inaczej, wpuszczą tylko jednym z nich."

[trailing-space-login.expect]
source = "c4e1b3ea2923"
text = "Konto otwiera tylko hasło ze spacją albo oba, bo obie strony przycinają."

[nfc-nfd-register.name]
source = "09955ee62d4d"
text = "Krok 1: rejestracja ze złożonymi polskimi literami"

[nfc-nfd-register.breaks]
source = "348a289dc753"
text = "Krok 1 testu normalizacji: załóż konto z hasłem, w którym polskie litery są pojedynczymi znakami, czyli w postaci, jaką wpisuje klawiatura."

[nfc-nfd-register.expect]
source = "d44b22c41423"
text = "Konto założone."

[nfc-nfd-login.name]
source = "308b47b288ac"
text = "Krok 2: logowanie tymi samymi literami w postaci rozłożonej"

[nfc-nfd-login.breaks]
source = "4b6f029daea9"
text = "Krok 2: zaloguj się tym samym słowem zapisanym jako litery podstawowe z akcentami łączonymi. Wygląda identycznie, a biblioteki haszujące biorą bajty tak, jak są, więc wpuści tylko aplikacja, która normalizuje hasło."

[nfc-nfd-login.expect]
source = "cda20136bcd3"
text = "Logowanie udane, bo hasło jest normalizowane do NFC przed haszowaniem."

[spaces-only.name]
source = "53e888f0638d"
text = "Szesnaście spacji"

[spaces-only.breaks]
source = "b08584a044b7"
text = "Spełnia minimalną długość 8, 12 albo 15 znaków i nie zawiera niczego, co da się zapamiętać. Warstwa, która przycina dane, robi z niego puste hasło."

[spaces-only.expect]
source = "18ff578ae87b"
text = "Odmowa z podanym powodem albo przyjęte i zachowane dokładnie, nigdy przycięte do pustego hasła."

[emoji-four.name]
source = "ad8767a6cbed"
text = "Cztery emoji klucza"

[emoji-four.breaks]
source = "15574f92a006"
text = "Cztery znaki, które String.length w JavaScripcie, .NET i Javie liczy jako osiem, bo każdy zajmuje dwie jednostki UTF-16, podczas gdy Python, PostgreSQL i NIST SP 800-63B liczą cztery. Strona i serwer napisane w różnych językach nie zgadzają się co do minimalnej długości."

[emoji-four.expect]
source = "7fc8f129fe3c"
text = "Policzone jako cztery znaki na stronie i na serwerze oraz przyjęte albo odrzucone tak samo po obu stronach."

[passphrase-64.name]
source = "f3eeadd0855b"
text = "Fraza z 64 znaków ze spacjami"

[passphrase-64.breaks]
source = "3031f9450279"
text = "NIST SP 800-63B zaleca przyjmowanie co najmniej 64 znaków i spacji, a formularz z maxlength 20 albo 32 albo z zakazem spacji odrzuca frazę, jaką użytkownikom radzi się wybierać."

[passphrase-64.expect]
source = "7eadbf077df2"
text = "Przyjęta w całości, a ta sama fraza otwiera potem konto."

[composition-ok.name]
source = "ae09a7dc52e2"
text = "Popularne hasło, które spełnia zwykłe reguły"

[composition-ok.breaks]
source = "35e722edda4a"
text = "Ma wielką literę, cyfrę i symbol, więc przechodzi zwykłe reguły złożoności, a w liście wyciekłych haseł Pwned Passwords występuje ponad 500 000 razy."

[composition-ok.expect]
source = "5a2fc34acc3d"
text = "Odrzucone jako popularne albo wyciekłe hasło, z podanym powodem."

[breached-but-valid.name]
source = "2c71c7b25e8c"
text = "Ścieżka po klawiaturze, która spełnia zwykłe reguły"

[breached-but-valid.breaks]
source = "328cc7b39e96"
text = "Wzór z klawiatury z wielką literą, cyframi i symbolem: przechodzi reguły złożoności, a w liście Pwned Passwords występuje ponad 150 000 razy."

[breached-but-valid.expect]
source = "5a2fc34acc3d"
text = "Odrzucone jako popularne albo wyciekłe hasło, z podanym powodem."

[login-maxlength.name]
source = "7a91063f7cc4"
text = "Hasło ze 100 znaków"

[login-maxlength.breaks]
source = "370229384b31"
text = "Rejestracja przyjmuje 100 znaków, a pole logowania ma mniejsze maxlength, często 64, więc przeglądarka po cichu odrzuca resztę i użytkownik nigdy się nie zaloguje."

[login-maxlength.expect]
source = "3f7b53429f18"
text = "To samo hasło działa w formularzu rejestracji, logowania i zmiany hasła albo wszystkie trzy odrzucają je z tym samym podanym limitem."

[cyrillic.name]
source = "0eb1f2ae1ddc"
text = "Hasło cyrylicą"

[cyrillic.breaks]
source = "b711c5f47ba6"
text = "NIST SP 800-63B zaleca przyjmowanie znaków Unicode. Reguła, która dopuszcza tylko ASCII, odrzuca hasło, albo rejestracja je przyjmuje, a starsza warstwa w kodowaniu jednobajtowym zapisuje coś innego."

[cyrillic.expect]
source = "4f9d2e793817"
text = "Przyjęte, a to samo hasło otwiera potem konto."

[angle-bracket.name]
source = "601303cdc59d"
text = "Hasło z nawiasami ostrymi"

[angle-bracket.breaks]
source = "5d5ff931228f"
text = "Walidacja żądań w ASP.NET na .NET Framework odrzuca wartość formularza ze znakiem mniejszości przed literą, więc poprawne hasło kończy się na stronie błędu."

[angle-bracket.expect]
source = "b95bddcc6f2a"
text = "Przyjęte jak każdy inny drukowalny znak ASCII."

[plus-and-percent.name]
source = "a339c4465788"
text = "Hasło z plusem i znakiem procentu"

[plus-and-percent.breaks]
source = "124efb5dd81e"
text = "W treści formularza plus znaczy spację, a %41 literę A. Klient, który składa treść ręcznie bez kodowania, wysyła Pa ssA-42, więc strona i ten klient zapisują różne hasła."

[plus-and-percent.expect]
source = "4b918a609edc"
text = "Zapisane i sprawdzane dokładnie tak, jak wpisane, w każdym kliencie."

[bcrypt-cut.name]
source = "1818c0888eac"
text = "Dwa hasła różniące się po 72. bajcie"

[bcrypt-cut.breaks]
source = "8a07821f372f"
text = "Krok 3 testu 72 bajtów: jeśli drugie hasło otworzyło konto, system haszuje tylko pierwsze 72 bajty i konto otwierają dwa różne hasła. Strona błędu w kroku 1 znaczy, że biblioteka odmawia długich haseł, a aplikacja tego nie obsługuje."

[bcrypt-cut.expect]
source = "44eb54f53a65"
text = "Logowanie drugim hasłem odrzucone, a rejestracja pierwszym przyjęta albo odrzucona z podanym limitem."

[bytes-not-chars.name]
source = "c56d672dccfd"
text = "Dwa polskie hasła różniące się po 72. bajcie"

[bytes-not-chars.breaks]
source = "7078f00fb7f7"
text = "Krok 3: jeśli drugie hasło otworzyło konto, sprawdzenie długości liczy znaki, a hash liczy bajty, więc hasło po polsku, cyrylicą albo po chińsku jest ucinane dużo wcześniej, niż sugeruje jego długość."

[bytes-not-chars.expect]
source = "57b549e44b4f"
text = "Logowanie drugim hasłem odrzucone."

[trailing-space.name]
source = "f8c945c633fa"
text = "Hasło ze spacją na końcu i bez niej"

[trailing-space.breaks]
source = "19e67adcfdc2"
text = "Krok 3: jeśli działa tylko jedno z dwóch logowań i nie jest to logowanie ze spacją, rejestracja i logowanie przycinają inaczej, a użytkownik, który ustawił spację, traci dostęp do konta."

[trailing-space.expect]
source = "c4e1b3ea2923"
text = "Konto otwiera tylko hasło ze spacją albo oba, bo obie strony przycinają."

[nfc-nfd.name]
source = "ed6f7c354cfd"
text = "Postać złożona i rozłożona tego samego hasła"

[nfc-nfd.breaks]
source = "dd091393cc9c"
text = "Krok 3: NIST SP 800-63B zaleca normalizację haseł do NFC. Bez niej to samo hasło wpisane w jednym systemie i wklejone z innego się nie zgadza."

[nfc-nfd.expect]
source = "7bd83fca6eeb"
text = "Obie postacie otwierają konto."
