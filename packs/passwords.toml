format = 1

[pack]
id          = "passwords"
name        = "Passwords"
description = "Passwords that registration and login read differently: cut after 72 bytes, trimmed, unnormalised or miscounted."
version     = "1.0"
updated     = 2026-11-04
license     = "CC-BY-4.0"
authors     = ["Naughty Keyboard"]
language    = "en"
tags        = ["password", "login", "authentication", "bcrypt", "unicode"]
fields      = ["password"]
risk        = "normal"

[[values]]
id     = "bcrypt-cut-register"
name   = "Step 1: register with 72 letters a and a 1"
value  = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1"
breaks = "Step 1 of the 72-byte test: register a new account with this password of 73 bytes. Newer libraries such as Go x/crypto, Spring Security and bcrypt 5 for Python refuse it, and an application that does not catch that shows an error page already here."
expect = "Registered, or refused with a message that names the length limit."
since  = "1.0"

[[values]]
id     = "bcrypt-cut-login"
name   = "Step 2: log in with 72 letters a and a 2"
value  = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa2"
breaks = "Step 2: log in to the account from step 1 with this password, which differs only in its 73rd byte. A bcrypt hash that reads only the first 72 bytes, as in PHP, BCrypt.Net, jBCrypt, bcryptjs and pgcrypto, cannot tell the two apart."
expect = "Login refused, because this is not the password the account was registered with."
since  = "1.0"

[[values]]
id     = "bytes-not-chars-register"
name   = "Step 1: register with 36 Polish letters and a 1"
value  = "\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u01421"
breaks = "Step 1 of the same test in Polish: 37 characters, under any limit counted in characters, and 73 bytes in UTF-8, because each l with stroke takes two bytes."
expect = "Registered."
since  = "1.0"

[[values]]
id     = "bytes-not-chars-login"
name   = "Step 2: log in with 36 Polish letters and a 2"
value  = "\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u0142\u01422"
breaks = "Step 2: log in with this password, which differs only in its last character. A limit of 64 or 72 characters does not stop a hash that reads 72 bytes from cutting it."
expect = "Login refused."
since  = "1.0"

[[values]]
id     = "trailing-space-register"
name   = "Step 1: register with a password that ends with a space"
value  = "Secret-pass-42\u0020"
breaks = "Step 1 of the trimming test: register with a password that ends with a space. A layer that trims input stores the password without it."
expect = "Registered, with the space kept as part of the password."
since  = "1.0"

[[values]]
id     = "trailing-space-login"
name   = "Step 2: log in with the same password without the space"
value  = "Secret-pass-42"
breaks = "Step 2: log in with the password from step 1 without its last space, then once more with the space. Registration and login that trim differently let only one of the two in."
expect = "Only the password with the space opens the account, or both do because both sides trim."
since  = "1.0"

[[values]]
id     = "nfc-nfd-register"
name   = "Step 1: register with composed Polish letters"
value  = "Za\u017C\u00F3\u0142\u0107-42"
breaks = "Step 1 of the normalisation test: register with Polish letters written as single characters, the form a keyboard types."
expect = "Registered."
since  = "1.0"

[[values]]
id     = "nfc-nfd-login"
name   = "Step 2: log in with the same letters decomposed"
value  = "Zaz\u0307o\u0301\u0142c\u0301-42"
breaks = "Step 2: log in with the same word written as base letters followed by combining accents. It looks identical, and hashing libraries take the bytes as given, so only an application that normalises the password lets it in."
expect = "Login succeeds, because the password is normalised to NFC before it is hashed."
since  = "1.0"

[[values]]
id     = "spaces-only"
name   = "Sixteen spaces"
type   = "repeat"
unit   = "\u0020"
count  = 16
breaks = "Passes a minimum length of 8, 12 or 15 characters and holds nothing a user could remember. A layer that trims input turns it into an empty password."
expect = "Refused with the reason stated, or accepted and kept exactly, never trimmed to an empty password."
since  = "1.0"

[[values]]
id     = "emoji-four"
name   = "Four key emoji"
value  = "\U0001F511\U0001F511\U0001F511\U0001F511"
breaks = "Four characters that String.length in JavaScript, .NET and Java counts as eight, because each takes two UTF-16 units, while Python, PostgreSQL and NIST SP 800-63B count four. A page and a server written in different languages disagree about the minimum length."
expect = "Counted as four characters on the page and on the server, and accepted or refused the same way by both."
since  = "1.0"

[[values]]
id     = "passphrase-64"
name   = "Passphrase of 64 characters with spaces"
value  = "four quiet rivers carry seven paper boats past the old mill gate"
breaks = "NIST SP 800-63B asks verifiers to accept at least 64 characters and the space, and a form with a maxlength of 20 or 32, or a rule against spaces, refuses the passphrase users are told to choose."
expect = "Accepted in full, and the same passphrase opens the account afterwards."
since  = "1.0"

[[values]]
id     = "composition-ok"
name   = "Common password that meets the usual rules"
value  = "Password1!"
breaks = "Has an upper-case letter, a digit and a symbol, so it passes the usual composition rules, and appears more than 500,000 times in the Pwned Passwords list of breached passwords."
expect = "Refused as a common or breached password, with the reason stated."
since  = "1.0"

[[values]]
id     = "breached-but-valid"
name   = "Keyboard walk that meets the usual rules"
value  = "Qwerty123!"
breaks = "A keyboard pattern with a capital letter, digits and a symbol: it passes composition rules and appears more than 150,000 times in the Pwned Passwords list."
expect = "Refused as a common or breached password, with the reason stated."
since  = "1.0"

[[values]]
id     = "login-maxlength"
name   = "Password of 100 characters"
type   = "repeat"
unit   = "Long-pass-"
count  = 10
breaks = "Registration accepts 100 characters while the login field has a lower maxlength, often 64, so the browser silently drops the rest and the user can never log in."
expect = "The same password works on the registration, login and password change forms, or all three refuse it with the same limit stated."
since  = "1.0"

[[values]]
id     = "cyrillic"
name   = "Password in Cyrillic"
value  = "\u043F\u0430\u0440\u043E\u043B\u044C-42"
breaks = "NIST SP 800-63B asks verifiers to accept Unicode. A rule that allows only ASCII refuses it, or registration accepts it and an older layer in a single-byte encoding stores something else."
expect = "Accepted, and the same password opens the account afterwards."
since  = "1.0"

[[values]]
id     = "angle-bracket"
name   = "Password with angle brackets"
value  = "pass<word>42"
breaks = "Request validation in ASP.NET on .NET Framework refuses a form value with a less-than sign followed by a letter, so a valid password ends at an error page."
expect = "Accepted like any other printing ASCII character."
since  = "1.0"

[[values]]
id     = "plus-and-percent"
name   = "Password with a plus and a percent sign"
value  = "Pa+ss%41-42"
breaks = "In a form-encoded body a plus means a space and %41 means A. A client that builds the body by hand without encoding sends Pa ssA-42, so the page and that client store different passwords."
expect = "Stored and checked exactly as typed, through every client."
since  = "1.0"

[[pairs]]
id       = "bcrypt-cut"
name     = "Two passwords that differ after byte 72"
relation = "identity"
a        = "bcrypt-cut-register"
b        = "bcrypt-cut-login"
breaks   = "Step 3 of the 72-byte test: if the second password opened the account, the system hashes only the first 72 bytes and two different passwords open it. An error page at step 1 means the library refuses long passwords and the application does not handle it."
expect   = "Login with the second password refused, and registration with the first accepted or refused with the limit stated."
since    = "1.0"

[[pairs]]
id       = "bytes-not-chars"
name     = "Two Polish passwords that differ after byte 72"
relation = "identity"
a        = "bytes-not-chars-register"
b        = "bytes-not-chars-login"
breaks   = "Step 3: if the second password opened the account, the length check counts characters while the hash counts bytes, so a password in Polish, Cyrillic or Chinese is cut far earlier than its length suggests."
expect   = "Login with the second password refused."
since    = "1.0"

[[pairs]]
id       = "trailing-space"
name     = "Password with and without a trailing space"
relation = "identity"
a        = "trailing-space-register"
b        = "trailing-space-login"
breaks   = "Step 3: if only one of the two logins works and it is not the one with the space, registration and login trim differently, and a user who set the space is locked out."
expect   = "Only the password with the space opens the account, or both do because both sides trim."
since    = "1.0"

[[pairs]]
id       = "nfc-nfd"
name     = "Composed and decomposed forms of one password"
relation = "identity"
a        = "nfc-nfd-register"
b        = "nfc-nfd-login"
breaks   = "Step 3: NIST SP 800-63B asks verifiers to normalise passwords to NFC. Without it, the same password typed on one system and pasted from another does not match."
expect   = "Both forms open the account."
since    = "1.0"
