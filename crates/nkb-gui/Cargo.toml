[package]
name = "nkb-gui"
description = "The nkb palette. A full product in its own right, not a CLI with a window."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The binary is named `nkb-gui`. That name is a public contract: it goes into
# installation instructions and into other people's scripts, and D25 froze both
# the number and the names of the executables.
[[bin]]
name = "nkb-gui"
path = "src/main.rs"

[dependencies]
nkb-core.workspace = true
nkb-app.workspace = true
nkb-adapters.workspace = true

# `renderer-software` is not decoration. It is what lets tests/appearance.rs
# render a screen WITHOUT A SCREEN, which is the only mechanism this project has
# for judging its own looks - ADR-4, criterion 4, and document 13 section 4.
#
# Cargo unifies features across dev and normal dependencies, so this renderer
# ships inside nkb-gui whether or not a test asked for it. That is accepted
# rather than worked around: a QA tool gets run over remote desktops and inside
# virtual machines, where a software fallback is the difference between a window
# and no window.
# `raw-window-handle-06` is what makes `Window::window_handle()` exist at all.
# Without it the palette cannot name its own window to the system, and C5b - the
# window refusing the keyboard focus - has nothing to put the style on.
slint = { workspace = true, features = ["renderer-software", "raw-window-handle-06"] }

# The traits that make the handle above readable. Licence sieve is in the
# workspace manifest beside the version, where a reader of the dependency will
# look for it.
raw-window-handle.workspace = true

# The clipboard, for `Ctrl+Alt+B`. Why here and nowhere else, and why it adds
# no crate to the product: the workspace manifest, beside the version.
arboard.workspace = true

[build-dependencies]
slint-build.workspace = true

# Puts `assets/edamame.ico` into the executable on Windows. Why this crate, and
# why that version: the workspace manifest, beside the version.
embed-resource.workspace = true

# Test-only, never linked into a released artefact. Document 09 section 10 puts
# that in the lighter tier: pin the version, read the licence, no registry entry.
# Checked against the registry 2026-09-07: 0.25.10, MIT OR Apache-2.0.
#
# Only PNG, and not the default set. The tests build a picture from raw pixels,
# write it as a PNG, and decode the PNGs inside the program's icon, and nothing
# else. The default set also switches on the AVIF and OpenEXR codecs, which
# dragged in an AV1 encoder, a fuzzing runtime and an unmaintained macro crate
# that nothing here ever calls, and made the first build in CI the slowest.
[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

# The oracle for the typeface guarantee (D66): what the toolkit's own text layout
# reads from the font's character map. Test-only, the same lighter tier as the
# line above. Checked against the registry 2026-09-23: MIT OR Apache-2.0.
#
# 🔴 Deliberately NOT the newest release (0.47.0 that day). 0.44.0 is the version
# Slint 1.18.1 locks, so the test asks exactly the reader the renderer asks - a
# newer one would be a second opinion, not the renderer's. It moves together with
# Slint, and tests/typeface_guarantee.rs fails when the lock file holds two.
skrifa = "0.44.0"

# This package does NOT inherit the workspace lints, and the reason is one
# single word. The workspace sets `unsafe_code = "forbid"`, and `forbid` cannot
# be lifted by anything downstream - not even by the code that Slint generates
# from ui/all.slint, which carries its own `allow(unsafe_code)` around a vtable
# macro. The build fails with E0453 before any of our own code is reached.
#
# So this package says `deny` instead. The difference is narrow and it is worth
# stating: `deny` still refuses unsafe in hand-written code, but it lets a
# deliberate `#[allow]` through, and a deliberate allow is visible in review
# whereas `forbid` simply makes the crate unbuildable.
#
# Recorded as a deviation in docs/00-ODSTEPSTWA.md, with the condition under
# which it goes back. Everything else is copied from the workspace unchanged.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
